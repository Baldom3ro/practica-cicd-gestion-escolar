name: Pipeline CI-CD - Gestion Escolar

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar entorno
        run: bash scripts/configurar_entorno.sh

      - name: Ejecutar pruebas
        run: bash scripts/ejecutar_pruebas.sh

      - name: Generar artefacto de liberacion
        run: bash scripts/generar_liberacion.sh

      - name: Guardar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    if: github.event_name != 'pull_request'
    needs: validar-y-probar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar aplicacion
        id: publicacion
        uses: actions/deploy-pages@v4
